# Supabase local development configuration.
# Run `supabase start` to boot Postgres, Auth, Storage, and the API in Docker.

project_id = "mars-technical-support"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Your app URL. Add your tunnel domain here for production logins.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Long-lived sessions so devices stay "remembered" (7 days here; refresh
# tokens rotate to keep users signed in beyond this without re-login).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = false
